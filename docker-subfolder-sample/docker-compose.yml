services:
  it-tools:
    container_name: it-tools-subfolder
    image: ghcr.io/sharevb/it-tools:baseurl-it-tools@sha256:bb7274ba05975550d1edb994ee1c47f42ec433dbff0e350155a0eda6b5dd68f4
    pull_policy: always
    restart: unless-stopped
  nginx-reverse-proxy:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on:
      - it-tools
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 80:80